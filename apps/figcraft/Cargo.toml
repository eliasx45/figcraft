[package]
name = "figcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FigCraft desktop app"
default-run = "figcraft"

[lints]
workspace = true

[dependencies]
figcraft-engine = { workspace = true }
figcraft-ui-egui = { workspace = true }
figcraft-collab-net = { workspace = true }
figcraft-format = { workspace = true }
figcraft-text = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
serde_json = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }
arboard = { workspace = true, features = ["image-data"] }
webbrowser = { workspace = true }
image = { workspace = true }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
# Clipboard images are signed Figma CDN URLs; reuse the workspace's rustls family.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
url = "2"

# The system's reduce-motion setting (UISettings.AnimationsEnabled), interface language
# (GlobalizationPreferences.Languages) and controllers for prototypes (Gaming.Input.Gamepad).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["UI_ViewManagement", "System_UserProfile", "Foundation_Collections", "Gaming_Input"] }

[dev-dependencies]
wat = { workspace = true }

[build-dependencies]
winresource = "0.1"
