[package]
name = "figcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FigCraft egui frontend (the Figma-style UI: canvas, toolbar, layers, design and prototype panels, menus); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
figcraft-geom = { workspace = true }
figcraft-color = { workspace = true }
figcraft-doc = { workspace = true }
figcraft-text = { workspace = true }
figcraft-layout = { workspace = true }
figcraft-render = { workspace = true }
figcraft-pathops = { workspace = true }
figcraft-engine = { workspace = true }
figcraft-format = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
egui_extras = { workspace = true }
web-time = "1.1.0"
figcraft-audio = { workspace = true }
figcraft-video = { workspace = true }
# Fork-only, desktop-only: EffectCraft cards render in-process from their saved .ecproj when the
# EffectCraft app isn't running (or has another project open). Never on for the browser build.
figcraft-ec-inproc = { workspace = true, optional = true }
# EffectCraft's real panels (its Timeline) hosted in FigCraft: same egui 0.36.
effectcraft-ui-egui = { path = "../../../effectcraft/crates/ui-egui", optional = true }

# Sound output for audio layers: macOS and Windows for now (Linux and FreeBSD need ALSA in their
# packages first; the browser build has none yet).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = { workspace = true }

[features]
default = []
effectcraft-inproc = ["dep:figcraft-ec-inproc", "dep:effectcraft-ui-egui"]

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[dev-dependencies]
zip = { workspace = true }
wat = { workspace = true }
